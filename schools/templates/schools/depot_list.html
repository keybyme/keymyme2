{% extends "base.html" %}
{% block title %}Clarksburg Depot{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-semibold text-gray-900">Clarksburg Depot</h1>
</div>

<div class="max-w-2xl rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <p class="mb-2 min-h-9 whitespace-pre-wrap text-center text-2xl font-black text-black">LEFTS &amp; RIGHTS</p>
    {% for link in links %}
    <p class="mb-2 min-h-6 whitespace-pre-wrap font-extrabold text-gray-700">
        <a href="{{ link.url }}" target="_blank" rel="noopener" class="text-blue-600 underline hover:text-blue-800">{{ link.name|default:link.url }}</a>
    </p>
    {% empty %}
    <p class="text-sm text-gray-500">No links yet.</p>
    {% endfor %}
</div>
{% endblock %}
