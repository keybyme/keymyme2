{% load allauth %}
<section class="mb-6">
    <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-gray-500">
        {% slot title %}
        {% endslot %}
    </h2>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}
    <ul class="mt-3 flex flex-wrap gap-3">
        {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
    </ul>
    {% endif %}
</section>
