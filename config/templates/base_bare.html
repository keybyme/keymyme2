{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}KeyByMe{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo_keybyme.png' %}">
    {% include "_tailwind_config.html" %}
</head>
<body class="min-h-screen bg-cream text-ink antialiased">
    <!-- No nav, no storage bar, unconditionally -- unlike base.html, this
         doesn't hide them for anonymous visitors only, it never renders
         them at all, even for a logged-in admin. Use for pages meant to
         look identical (and blank of KeyByMe chrome) to everyone,
         regardless of who's viewing -- e.g. schools/depot_list.html. -->
    <main class="mx-auto max-w-6xl px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
